<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>ETAD Delivery Command — ETx 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div class="shell">

  <!-- Masthead -->
  <header class="masthead">
    <div class="mast-top">
      <div class="brand">
        <div class="mark">ET</div>
        <div class="titles">
          <div class="eyebrow">ETAD · ETx 2026</div>
          <h1>Delivery Command</h1>
          <div class="sub">What needs to get done — tracked live, week by week</div>
        </div>
      </div>
      <div class="mast-tools" id="mast-tools"></div>
    </div>
    <div class="kpi-strip" id="kpi-strip"></div>
  </header>

  <!-- Signature: live week rail -->
  <div class="rail" id="rail"></div>

  <!-- Portfolio overview -->
  <div class="overview" id="overview"></div>

  <!-- Sections A–D + TBR -->
  <main id="sections"></main>

  <!-- Quarterly horizon -->
  <div id="quarterly"></div>

  <!-- Footer -->
  <footer class="foot" id="foot"></footer>

</div>

<!-- Toast + hidden import input -->
<div class="toast" id="toast"><span class="dot"></span><span class="msg"></span></div>
<input type="file" id="file-import" accept="application/json,.json" hidden>

<script src="background.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
